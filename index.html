<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Form</title>
</head>

<body>
    <nav class="my-navbar">
    <a href="index.html">Contact Form</a>
    <a href="part2.html">Bootstrap Form</a>
    <a href="registration.html">Registration</a>
</nav>
<main>

    <h1>Basic HTML Contact Form with Validation</h1>

    <form>

        <label for="name ">Name</label>
        <input type="text" id="name" name="name" minlength="2" maxlength="50" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message"  minlength="10" maxlength="300" required></textarea>
        <button type="submit">Submit</button>

    </form>

</main>

</body>

</html>
